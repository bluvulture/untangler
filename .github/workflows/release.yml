# SPDX-License-Identifier: GPL-2.0-or-later
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install GNOME packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnome-shell libglib2.0-bin unzip
      - run: npm run verify
      - run: npm run package
      - run: sha256sum 'untangler@bluvulture.shell-extension.zip' > 'untangler@bluvulture.shell-extension.zip.sha256'
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" \
            --notes "Source commit: $GITHUB_SHA" \
            'untangler@bluvulture.shell-extension.zip' \
            'untangler@bluvulture.shell-extension.zip.sha256'
